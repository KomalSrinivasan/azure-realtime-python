[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "az-realtime-webrtc"
version = "0.2.1"
description = "Python SDK for Azure OpenAI Realtime API with WebSocket support, streaming, and tool calling"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Nexora" }]
keywords = ["azure", "openai", "realtime", "webrtc", "websocket", "voice", "speech", "ai", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
flask = ["flask>=3.0.0"]
fastapi = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
azure = ["azure-identity>=1.16.0"]
all = [
    "flask>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "azure-identity>=1.16.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/KomalSrinivasan/azure-realtime-python"
Documentation = "https://github.com/KomalSrinivasan/azure-realtime-python#readme"
Repository = "https://github.com/KomalSrinivasan/azure-realtime-python"

[tool.hatch.build.targets.wheel]
packages = ["azure_realtime_webrtc"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
